# JY-Sprint4 12/11/2026: AUD-010. Análisis de calidad y seguridad (SAST) con SonarQube Cloud (SonarCloud), con
# resultados de pruebas y cobertura. No despliega nada (eso es deploy-backend.yml).
# Requisitos (una sola vez):
#   - SonarCloud: proyecto Johann-Yamil15_CampusBite-Back con "Automatic Analysis" apagado (C# se analiza por CI).
#   - GitHub > Settings > Secrets and variables > Actions:
#       secreto   SONAR_TOKEN
#       variables SONAR_ORGANIZATION (johann-yamil15, en minúsculas) y SONAR_PROJECT_KEY (Johann-Yamil15_CampusBite-Back)
# Las acciones van fijadas por SHA (regla githubactions:S7637); el comentario dice a qué versión corresponde.
#
# JY-Sprint4 12/11/2026: cada proceso es su propio job y se ve por separado en el grafo de GitHub, sin agrupar nada:
#
#   Configuración → Restauración → Compilación ─┬─ Pruebas Application ─┬─ Cobertura → Análisis SonarCloud → Quality Gate
#                                               └─ Pruebas Api ─────────┘
#
# Toda la lógica está escrita aquí (sin scripts aparte) y cada job deja su resumen en la página "Summary".
# El escáner de .NET necesita compilar entre "begin" y "end" en la misma máquina, así que el job de análisis vuelve a
# compilar; los resultados de pruebas y la cobertura le llegan de los jobs de pruebas como artefactos.
name: 🔍 SonarCloud

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Sin permisos a nivel de workflow (regla githubactions:S8264): cada job pide solo lo que usa
permissions: {}

# Si llegan dos push seguidos a la misma rama o PR, solo sigue el último
concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.x"
  SONARSCANNER_VERSION: "12.1.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  configuracion:
    name: ✅ Configuración
    runs-on: ubuntu-latest
    permissions: {}                # no usa el token de GitHub
    # Los PR que vienen de un fork no reciben secretos: se omiten en lugar de fallar
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: ✅ Revisar secretos y variables
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          # El nombre de la rama lo controla quien abre el PR: va por variable, nunca interpolado en el script
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          faltan=""
          [ -n "$SONAR_TOKEN" ]        || faltan="$faltan secreto:SONAR_TOKEN"
          [ -n "$SONAR_ORGANIZATION" ] || faltan="$faltan variable:SONAR_ORGANIZATION"
          [ -n "$SONAR_PROJECT_KEY" ]  || faltan="$faltan variable:SONAR_PROJECT_KEY"
          # Del token solo se dice si existe, nunca su valor
          si() { [ -n "$1" ] && echo "✅" || echo "❌ falta"; }
          {
            echo "## ✅ Configuración"
            echo "| Elemento | Tipo | Estado |"
            echo "|---|---|---|"
            echo "| \`SONAR_TOKEN\` | secreto | $(si "$SONAR_TOKEN") |"
            echo "| \`SONAR_ORGANIZATION\` | variable | $(si "$SONAR_ORGANIZATION") \`${SONAR_ORGANIZATION}\` |"
            echo "| \`SONAR_PROJECT_KEY\` | variable | $(si "$SONAR_PROJECT_KEY") \`${SONAR_PROJECT_KEY}\` |"
            echo ""
            echo "Evento: \`${EVENTO}\` · Rama: \`${RAMA}\` · Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en GitHub (Settings > Secrets and variables > Actions):$faltan"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  restaurar:
    name: 📦 Restauración
    needs: configuracion
    runs-on: ubuntu-latest
    permissions:
      contents: read             # solo para el checkout
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🟣 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restaurar dependencias
        run: |
          set -o pipefail
          dotnet restore CampusBite-Back.sln 2>&1 | tee restore.log

      - name: 📝 Resumen de la restauración
        if: ${{ !cancelled() }}
        run: |
          [ -f restore.log ] || exit 0
          bt=$(printf '\x60'); cerca="${bt}${bt}${bt}"      # comilla invertida de Markdown
          {
            echo "## 📦 Restauración"
            echo "SDK: \`$(dotnet --version)\`"
            echo ""
            echo "| Proyecto | Resultado |"
            echo "|---|---|"
            { grep -E 'Restored .*\.csproj' restore.log || true; } \
              | sed -E "s|.*Restored .*/([^/]+)\.csproj.*|\| ${bt}\1${bt} \| ✅ restaurado \||" | sort -u
            { grep -E 'error NU[0-9]+' restore.log || true; } | sed -E 's/^ *//; s/^/| ❌ | /; s/$/ |/'
            echo ""
            echo "Paquetes NuGet por proyecto:"
            echo ""
            echo "$cerca"
            dotnet list CampusBite-Back.sln package 2>/dev/null | grep -E '^Project|^ *>' || true
            echo "$cerca"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  compilar:
    name: 🏗️ Compilación
    needs: restaurar
    runs-on: ubuntu-latest
    permissions:
      contents: read             # solo para el checkout
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🟣 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🏗️ Compilar
        run: |
          set -o pipefail
          dotnet build CampusBite-Back.sln --configuration Release 2>&1 | tee build.log

      # También si la compilación falló, para ver los errores aquí mismo
      - name: 📝 Resumen de la compilación
        if: ${{ !cancelled() }}
        run: |
          [ -f build.log ] || exit 0
          bt=$(printf '\x60'); cerca="${bt}${bt}${bt}"      # comilla invertida de Markdown
          # GitHub corre los pasos con "bash -eo pipefail": un grep sin coincidencias no debe cortar el resumen
          adv=$(grep -E ': warning [A-Z]+[0-9]+' build.log | sed 's/ \[.*\]$//' | sort -u || true)
          err=$(grep -E ': error [A-Z]+[0-9]+' build.log | sed 's/ \[.*\]$//' | sort -u || true)
          n_adv=$(printf '%s' "$adv" | grep -c . || true)
          n_err=$(printf '%s' "$err" | grep -c . || true)
          {
            echo "## 🏗️ Compilación"
            if [ "$n_err" -eq 0 ]; then echo "**✅ Correcta** · Release · .NET ${DOTNET_VERSION}"; else echo "**❌ Con errores**"; fi
            echo ""
            echo "| Proyecto | Resultado |"
            echo "|---|---|"
            { grep -E ' -> /' build.log || true; } | sed -E "s/^ *([^ ]+) -> .*/| ${bt}\1${bt} | ✅ compilado |/" | sort -u
            echo ""
            echo "Advertencias: **${n_adv}** · Errores: **${n_err}**"
            if [ "$n_err" -gt 0 ]; then printf '\n### ❌ Errores\n%s\n%s\n%s\n' "$cerca" "$err" "$cerca"; fi
            if [ "$n_adv" -gt 0 ]; then printf '\n### ⚠️ Advertencias\n%s\n%s\n%s\n' "$cerca" "$adv" "$cerca"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  # Las pruebas de cada proyecto son un job aparte (no una matrix, que el grafo muestra agrupada)
  pruebas_application:
    name: 🧪 Pruebas Application
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read             # solo para el checkout
    env:
      PROYECTO: CampusBite.Application.Tests
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🟣 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # coverlet.collector ya está en el proyecto: cobertura OpenCover; el .trx son los resultados de cada prueba
      - name: 🧪 Correr pruebas con cobertura
        run: >-
          dotnet test "tests/$PROYECTO/$PROYECTO.csproj"
          --configuration Release
          --results-directory TestResults
          --logger "trx;LogFileName=$PROYECTO.trx"
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: 📝 Resumen por clase de prueba
        if: ${{ !cancelled() }}
        run: |
          python3 - "TestResults/$PROYECTO.trx" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          print(f"## 🧪 Pruebas {os.environ['PROYECTO']}")
          if not os.path.exists(sys.argv[1]):
              print("> ⚠️ No hay resultados (.trx): las pruebas no llegaron a correr."); sys.exit()
          raiz = ET.parse(sys.argv[1]).getroot()
          clase_de = {u.get("id"): u.find("t:TestMethod", ns).get("className").split(".")[-1]
                      for u in raiz.iterfind("t:TestDefinitions/t:UnitTest", ns)}
          clases, fallidas = {}, []
          for r in raiz.iterfind("t:Results/t:UnitTestResult", ns):
              c = clases.setdefault(clase_de.get(r.get("testId"), "?"), {"Passed": 0, "Failed": 0, "otras": 0})
              c[r.get("outcome") if r.get("outcome") in ("Passed", "Failed") else "otras"] += 1
              if r.get("outcome") == "Failed":
                  msg = r.findtext("t:Output/t:ErrorInfo/t:Message", default="", namespaces=ns).strip().splitlines()
                  fallidas.append((r.get("testName"), msg[0][:200] if msg else ""))
          k = raiz.find("t:ResultSummary/t:Counters", ns).attrib
          print(f"**Total {k['total']} · ✅ {k['passed']} · ❌ {k['failed']} · ⏭️ {k['notExecuted']}**\n")
          print("| Clase de prueba | ✅ Pasaron | ❌ Fallaron | ⏭️ Otras |")
          print("|---|---:|---:|---:|")
          for nombre, c in sorted(clases.items()):
              print(f"| `{nombre}` | {c['Passed']} | {c['Failed']} | {c['otras']} |")
          if fallidas:
              print(f"\n### ❌ Pruebas fallidas ({len(fallidas)})")
              for nombre, msg in fallidas:
                  print(f"- `{nombre}`: {msg}")
          PY

      # También si fallaron pruebas: Cobertura y Análisis los usan y el workflow queda en rojo igual
      - name: 📤 Guardar resultados y cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-application
          path: TestResults/
          retention-days: 7
          if-no-files-found: error

  pruebas_api:
    name: 🧪 Pruebas Api
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read             # solo para el checkout
    env:
      PROYECTO: CampusBite.Api.Tests
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🟣 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # coverlet.collector ya está en el proyecto: cobertura OpenCover; el .trx son los resultados de cada prueba
      - name: 🧪 Correr pruebas con cobertura
        run: >-
          dotnet test "tests/$PROYECTO/$PROYECTO.csproj"
          --configuration Release
          --results-directory TestResults
          --logger "trx;LogFileName=$PROYECTO.trx"
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: 📝 Resumen por clase de prueba
        if: ${{ !cancelled() }}
        run: |
          python3 - "TestResults/$PROYECTO.trx" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          print(f"## 🧪 Pruebas {os.environ['PROYECTO']}")
          if not os.path.exists(sys.argv[1]):
              print("> ⚠️ No hay resultados (.trx): las pruebas no llegaron a correr."); sys.exit()
          raiz = ET.parse(sys.argv[1]).getroot()
          clase_de = {u.get("id"): u.find("t:TestMethod", ns).get("className").split(".")[-1]
                      for u in raiz.iterfind("t:TestDefinitions/t:UnitTest", ns)}
          clases, fallidas = {}, []
          for r in raiz.iterfind("t:Results/t:UnitTestResult", ns):
              c = clases.setdefault(clase_de.get(r.get("testId"), "?"), {"Passed": 0, "Failed": 0, "otras": 0})
              c[r.get("outcome") if r.get("outcome") in ("Passed", "Failed") else "otras"] += 1
              if r.get("outcome") == "Failed":
                  msg = r.findtext("t:Output/t:ErrorInfo/t:Message", default="", namespaces=ns).strip().splitlines()
                  fallidas.append((r.get("testName"), msg[0][:200] if msg else ""))
          k = raiz.find("t:ResultSummary/t:Counters", ns).attrib
          print(f"**Total {k['total']} · ✅ {k['passed']} · ❌ {k['failed']} · ⏭️ {k['notExecuted']}**\n")
          print("| Clase de prueba | ✅ Pasaron | ❌ Fallaron | ⏭️ Otras |")
          print("|---|---:|---:|---:|")
          for nombre, c in sorted(clases.items()):
              print(f"| `{nombre}` | {c['Passed']} | {c['Failed']} | {c['otras']} |")
          if fallidas:
              print(f"\n### ❌ Pruebas fallidas ({len(fallidas)})")
              for nombre, msg in fallidas:
                  print(f"- `{nombre}`: {msg}")
          PY

      # También si fallaron pruebas: Cobertura y Análisis los usan y el workflow queda en rojo igual
      - name: 📤 Guardar resultados y cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-api
          path: TestResults/
          retention-days: 7
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  cobertura:
    name: 📊 Cobertura
    needs: [pruebas_application, pruebas_api]
    # Corre aunque fallen pruebas (si hay resultados), para que se vea cuánto quedó cubierto
    if: ${{ !cancelled() && needs.pruebas_application.result != 'skipped' && needs.pruebas_api.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions: {}                # no usa el token de GitHub
    steps:
      - name: 📥 Traer resultados de los dos proyectos de prueba
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: resultados-*
          path: TestResults
          merge-multiple: true

      # Una línea cuenta como cubierta si alguno de los dos reportes la visitó
      - name: 📊 Combinar y resumir la cobertura
        run: |
          python3 - TestResults >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          print("## 📊 Pruebas y cobertura (todo junto)")
          print("| Proyecto de prueba | Total | ✅ Pasaron | ❌ Fallaron | ⏭️ Omitidas |")
          print("|---|---:|---:|---:|---:|")
          suma = [0, 0, 0, 0]
          for ruta in sorted(glob.glob(os.path.join(sys.argv[1], "*.trx"))):
              k = ET.parse(ruta).getroot().find("t:ResultSummary/t:Counters", ns).attrib
              fila = [int(k["total"]), int(k["passed"]), int(k["failed"]), int(k["notExecuted"])]
              suma = [a + b for a, b in zip(suma, fila)]
              print(f"| `{os.path.basename(ruta)[:-4]}` | " + " | ".join(map(str, fila)) + " |")
          print("| **Total** | " + " | ".join(f"**{x}**" for x in suma) + " |\n")
          reportes = sorted(glob.glob(os.path.join(sys.argv[1], "*", "coverage.opencover.xml")))
          lineas = {}
          for ruta in reportes:
              for m in ET.parse(ruta).getroot().iter("Module"):
                  archivos = {f.get("uid"): f.get("fullPath") for f in m.iter("File")}
                  for sp in m.iter("SequencePoint"):
                      clave = (m.findtext("ModuleName"), archivos.get(sp.get("fileid")), sp.get("sl"))
                      lineas[clave] = lineas.get(clave, False) or int(sp.get("vc", "0")) > 0
          if not lineas:
              print("> ⚠️ No se encontraron reportes de cobertura."); sys.exit()
          por = {}
          for (ens, _, _), v in lineas.items():
              c, t = por.get(ens, (0, 0)); por[ens] = (c + v, t + 1)
          print("| Ensamblado | Líneas cubiertas | Cobertura de líneas |")
          print("|---|---:|---:|")
          for ens, (c, t) in sorted(por.items()):
              print(f"| `{ens}` | {c} / {t} | {100 * c / t:.1f} % |")
          c = sum(lineas.values())
          print(f"| **Total** | **{c} / {len(lineas)}** | **{100 * c / len(lineas):.1f} %** |\n")
          print(f"{len(reportes)} reportes OpenCover combinados. SonarCloud puede dar otra cifra: también cuenta ramas "
                "(if/else) y aplica sus propias exclusiones.")
          PY

  # ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  sonar:
    name: 🔍 Análisis SonarCloud
    needs: cobertura
    if: ${{ !cancelled() && needs.cobertura.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read             # solo para el checkout
    outputs:
      tarea: ${{ steps.publicar.outputs.tarea }}
      panel: ${{ steps.publicar.outputs.panel }}
    steps:
      - name: 📥 Checkout (historial completo, para blame y código nuevo)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: 🟣 Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # SonarCloud exige Java 21 o más nuevo para el motor del escáner (Java 17 ya no se acepta)
      - name: ☕ Java 21 (lo usa el escáner)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: 🗃️ Caché de SonarCloud
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 📥 Traer resultados y cobertura
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: resultados-*
          path: TestResults
          merge-multiple: true

      - name: 🧰 Instalar escáner ${{ env.SONARSCANNER_VERSION }}
        run: dotnet tool install --global dotnet-sonarscanner --version "$SONARSCANNER_VERSION"

      # El token llega por variable de entorno (no se interpola en el script) y GitHub lo enmascara en el log.
      # Exclusiones: bin/obj y los scripts SQL consolidados de db/consolidado/versiones, que son copias generadas
      # de db/scripts (los scripts fuente sí se analizan). Las pruebas no cuentan para la cobertura.
      # skipJreProvisioning: usa el Java 21 del paso anterior en lugar de descargar otro en cada análisis.
      - name: 🔍 Iniciar análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >-
          dotnet-sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.scanner.skipJreProvisioning=true
          /d:sonar.cs.opencover.reportsPaths="TestResults/*/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx"
          /d:sonar.exclusions="**/bin/**,**/obj/**,db/consolidado/versiones/**"
          /d:sonar.coverage.exclusions="tests/**,**/Program.cs"

      - name: 🏗️ Compilar para el análisis
        run: dotnet build CampusBite-Back.sln --configuration Release

      - name: 📤 Publicar análisis en SonarCloud
        id: publicar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
          # Datos de la tarea de SonarCloud para el job "Quality Gate"
          tarea=".sonarqube/out/.sonar/report-task.txt"
          bt=$(printf '\x60')                                 # comilla invertida de Markdown
          echo "tarea=$(grep '^ceTaskUrl=' "$tarea" | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "panel=$(grep '^dashboardUrl=' "$tarea" | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          {
            echo "## 🔍 Análisis SonarCloud"
            echo "**✅ Publicado.** SonarCloud lo procesa ahora; el resultado aparece en el job **🚦 Quality Gate**."
            echo ""
            echo "| Dato | Valor |"
            echo "|---|---|"
            grep -E '^(organization|projectKey|serverUrl|dashboardUrl|ceTaskId)=' "$tarea" \
              | sed -E "s/^([^=]+)=(.*)\$/| ${bt}\1${bt} | \2 |/"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────────────────────────────────────────
  # Espera a que SonarCloud procese el análisis y muestra el resultado. Falla si el Quality Gate no se aprueba.
  quality_gate:
    name: 🚦 Quality Gate
    needs: sonar
    if: ${{ !cancelled() && needs.sonar.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}                # no usa el token de GitHub
    steps:
      - name: 🚦 Esperar y revisar el resultado
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          TAREA: ${{ needs.sonar.outputs.tarea }}
          PANEL: ${{ needs.sonar.outputs.panel }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import base64, json, os, sys, time, urllib.parse, urllib.request
          servidor = "https://sonarcloud.io"
          def api(url):
              req = urllib.request.Request(url)
              req.add_header("Authorization", "Basic " + base64.b64encode(f"{os.environ['SONAR_TOKEN']}:".encode()).decode())
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          print("## 🚦 Quality Gate")
          fin = time.time() + 300                        # SonarCloud procesa el análisis después de recibirlo
          while True:
              tarea = api(os.environ["TAREA"])["task"]
              if tarea["status"] not in ("PENDING", "IN_PROGRESS") or time.time() > fin:
                  break
              time.sleep(5)
          if tarea["status"] != "SUCCESS":
              print(f"**❌ SonarCloud no terminó de procesar el análisis** (estado: `{tarea['status']}`) · "
                    f"[Ver en SonarCloud]({os.environ['PANEL']})")
              sys.exit(1)
          gate = api(f"{servidor}/api/qualitygates/project_status?analysisId={tarea['analysisId']}")["projectStatus"]
          estado = {"OK": "✅ Aprobado", "ERROR": "❌ No aprobado"}.get(gate["status"], f"⚠️ {gate['status']}")
          print(f"**{estado}** · [Ver en SonarCloud]({os.environ['PANEL']})\n")
          print("| Condición | Valor | Falla si | Estado |")
          print("|---|---:|---:|---|")
          for c in gate.get("conditions", []):
              signo = {"GT": ">", "LT": "<"}.get(c.get("comparator"), c.get("comparator", ""))
              print(f"| `{c['metricKey']}` | {c.get('actualValue', '—')} | {signo} {c.get('errorThreshold', '')} "
                    f"| {'✅' if c['status'] == 'OK' else '❌'} |")
          ambito = {"pullRequest": tarea["pullRequest"]} if tarea.get("pullRequest") else \
                   {"branch": tarea["branch"]} if tarea.get("branch") else {}
          metricas = [("bugs", "🐞 Bugs"), ("vulnerabilities", "🔓 Vulnerabilidades"),
                      ("security_hotspots", "🔥 Security hotspots"), ("code_smells", "🧹 Code smells"),
                      ("coverage", "📊 Cobertura"), ("duplicated_lines_density", "📑 Duplicación"),
                      ("ncloc", "📏 Líneas de código"), ("new_coverage", "📊 Cobertura del código nuevo"),
                      ("new_duplicated_lines_density", "📑 Duplicación del código nuevo")]
          q = urllib.parse.urlencode({"component": os.environ["SONAR_PROJECT_KEY"],
                                      "metricKeys": ",".join(k for k, _ in metricas), **ambito})
          medidas = {m["metric"]: m for m in api(f"{servidor}/api/measures/component?{q}")["component"]["measures"]}
          print("\n| Métrica | Valor |")
          print("|---|---:|")
          for k, nombre in metricas:
              if k in medidas:
                  m = medidas[k]
                  v = m.get("value") or (m.get("periods") or [{}])[0].get("value")
                  v = "—" if v is None else f"{float(v):.1f} %" if k.endswith(("coverage", "density")) else v
                  print(f"| {nombre} | {v} |")
          if gate["status"] == "ERROR":
              sys.exit(1)
          PY
